name: BugTracker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Validate backend syntax
        working-directory: server
        run: node --check src/server.js

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          test -n "$SERVER_HOST" || { echo "SERVER_HOST is missing"; exit 1; }
          test -n "$SERVER_USER" || { echo "SERVER_USER is missing"; exit 1; }
          test -n "$SERVER_SSH_KEY" || { echo "SERVER_SSH_KEY is missing"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -eu

            cd /opt/bugtracker

            echo "Checking required commands..."
            command -v git
            command -v docker
            docker compose version

            echo "Updating application code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "Checking container status..."
            docker compose ps

            echo "Checking application response..."
            curl --retry 10 \
              --retry-delay 3 \
              --retry-connrefused \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:80/ \
              -o /dev/null

            echo "BugTracker deployment completed successfully"